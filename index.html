<style>
*{box-sizing:border-box} [hidden]{display:none!important} html{scroll-behavior:smooth}
:root{--ink:#172a23;--dark:#154337;--lime:#d9ed9c;--paper:#f8f6ec;--olive:#53655a}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 "Microsoft JhengHei","PingFang TC",sans-serif}
a{color:inherit;text-underline-offset:.22em} a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid #a74b1c;outline-offset:3px}
.wrap{width:min(1180px,calc(100% - 40px));margin-inline:auto}
header{background:#faf9ef;border-bottom:1px solid #e4e3d4} .nav{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:850;font-size:1.23rem}
.mark{width:27px;height:27px;border-radius:70% 28% 68% 38%;background:#357455;transform:rotate(-18deg)}
.navlinks{display:flex;gap:clamp(12px,3vw,30px);align-items:center;font-size:.88rem;font-weight:700}
.hero{background:#153d34;color:#fff8df}.hero-grid{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:32px;padding-block:clamp(25px,5vw,62px)}
h1,h2,h3,p{margin:0} h1{font-size:clamp(2.5rem,6vw,5.5rem);line-height:1.05;letter-spacing:-.055em}
.hero p{max-width:37ch;margin:20px 0 23px;color:#f0efda}
.hero figure{margin:0;position:relative}.hero img{width:100%;aspect-ratio:1.68;object-fit:cover;display:block;border-radius:10px 52px 10px 10px}
.hero figcaption{position:absolute;bottom:8px;right:8px;background:#142c24;color:white;padding:3px 8px;font-size:.75rem}
button,.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border-radius:7px;border:0;padding:.62rem 1rem;font:inherit;font-weight:800;text-decoration:none;cursor:pointer;background:var(--lime);color:#183126}
button:hover,.button:hover{filter:brightness(.95)} button.secondary{background:#e7ecdf}
main{padding-block:38px 55px}#finder{scroll-margin-top:12px}h2{font-size:clamp(1.5rem,3vw,2.2rem);line-height:1.18}
.mode{margin:16px 0 23px;border-left:4px solid #7c9537;background:#edf0d8;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.mode label{font-weight:750;display:flex;gap:8px;align-items:center}
.columns{display:grid;grid-template-columns:minmax(280px,1fr) minmax(0,1.65fr);gap:25px;align-items:start}
form,.box,.trip{background:#fffdf7;border:1px solid #dedfd1;border-radius:12px;padding:17px;min-width:0}
form h3{margin-bottom:10px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-weight:700}input,select,textarea{font:inherit;max-width:100%;color:var(--ink)}
input:not([type=checkbox]),select,textarea{display:block;width:100%;border:1px solid #a9b4a6;background:#fff;border-radius:5px;min-height:43px;padding:6px 8px}
legend{font-weight:800}fieldset{margin:14px 0;border:0;padding:0;min-width:0}
.checks{display:flex;gap:4px 12px;flex-wrap:wrap}.checks label{display:inline-flex;align-items:center;min-height:32px;font-size:.92rem}
input[type=checkbox]{width:17px;height:17px;accent-color:#285944} details{margin:12px 0}summary{cursor:pointer;font-weight:750}
.error{display:block;color:#9b3019;font-size:.86rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.results h3{font-size:1.24rem;margin-bottom:8px}.results .box{margin-bottom:12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.trip h4{font-size:1.12rem;line-height:1.35;margin:4px 0 8px}
.trip p,p.help{font-size:.91rem}.trip p+p{margin-top:8px}.tag{display:inline-block;font-size:.78rem;font-weight:800;color:#5f3711;background:#f8e6bf;padding:2px 7px;border-radius:4px}.rain-tag{margin-left:6px;background:#deecdd;color:#174735}.price{font-size:1.15rem!important;font-weight:800;color:var(--dark)}
.trip ol{padding-left:1.25em;margin:.5em 0}.trip li{margin-bottom:.6em}.trip a{overflow-wrap:anywhere}
#candidateTitle{margin-top:16px}#consult{margin-top:18px}textarea{min-height:100px}footer.page{border-top:1px solid #d9ddce;padding:18px 0;color:var(--olive);font-size:.9rem}
@media(max-width:1023px){.columns{grid-template-columns:1fr}.hero-grid{gap:20px}}
@media(max-width:767px){.wrap{width:calc(100% - 28px)}.hero-grid,.fields,.cards{grid-template-columns:1fr}.hero-grid{gap:12px}.hero p{margin:12px 0}.hero img{aspect-ratio:2}.navlinks{gap:10px}main{padding-top:24px}}

const money = value => 'NT$ ' + value.toLocaleString('zh-TW');

const today = dateFormat.format(new Date());
const addDays = (date, count) => new Date(Date.parse(date + 'T00:00:00Z') + count * 86400000).toISOString().slice(0,10);
// Rain suitability is an editorial assessment of the itinerary, backed by its listed stop.
const rainOptions = {
 F02:{stop:'tw-taichung-nmns',reason:'以館內自然科學展示為主'},
 F03:{stop:'tw-pingtung-nmmba',reason:'以館內海洋生態展示為主'},
 S02:{stop:'tw-chiayi-npm-south',reason:'以博物館文物展覽為主'}
};
const plans = [
 ['F01','動物觀察一日','親子','臺北市',1,['動物觀察'],[900,1300],[['tw-taipei-zoo',1]]],
 ['F02','科學探索一日','親子','臺中市',1,['科學探索'],[800,1200],[['tw-taichung-nmns',1]]],
 ['F03','海洋探索一日','親子','屏東縣',1,['海洋生態'],[1100,1800],[['tw-pingtung-nmmba',1]]],
 ['C01','港邊夕照一日','情侶','新北市',1,['水岸散步'],[850,1500],[['tw-newtaipei-tamsui-wharf',1]]],
 ['C02','高美生態散步','情侶','臺中市',1,['水岸散步'],null,[['tw-taichung-gaomei',1]]],
 ['C03','淡水與板橋光影兩日','情侶','新北市',2,['水岸散步','光影活動'],[2400,3800],[['tw-newtaipei-tamsui-wharf',1],['tw-newtaipei-christmasland-2026',2]]],
 ['C04','龍崎山林光影','情侶','臺南市',1,['光影活動'],null,[['tw-tainan-longci-2027',1]]],
 ['S01','日月潭湖景一日','熟齡','南投縣',1,['湖景慢遊'],[1000,1600],[['tw-nantou-xiangshan',1]]],
 ['S02','亞洲藝術一日','熟齡','嘉義縣',1,['文化歷史'],[950,1500],[['tw-chiayi-npm-south',1]]],
 ['S03','林業故事一日','熟齡','宜蘭縣',1,['文化歷史'],[800,1400],[['tw-yilan-luodong-forestry',1]]]
].map(([id,title,audience,origin,days,tags,range,stops]) => ({
 id,title,audience,origin,days,tags,stops,rain:rainOptions[id] ?? null,status:'模擬資料',expiresOn:null,mobility:{},
 estimate:range && {range,validUntil:'2026-12-27',checkedOn:'2026-11-27',scope:'TWD/person/trip',people:null,source:'教學示範假設',includes:'基本行程安排示意',excludes:'實際門票、交通、餐宿及個人消費'}
}));
const styleInputs = styles.map(style => {
 const label = document.createElement('label');
 const input = document.createElement('input');
 input.type = 'checkbox'; input.value = style; input.checked = style === '不拘';
 input.setAttribute('aria-describedby','style-error');
 label.append(input,' ' + style); $('styles').append(label);
 return input;
});
styleInputs.forEach(input => input.addEventListener('change', () => {
 if (!input.checked) return;
 styleInputs.forEach(other => {
   if (other !== input && (input.value === '不拘' || other.value === '不拘')) other.checked = false;
 });
}));
$('departure').min = today;
const classifications = {
 audience:'旅客類型', origin:'出發地', days:'出遊天數', budget:'預算上限',
 date:'活動日期或狀態', access:'必要動線'
};
function readDemand() {
 const demand = Object.fromEntries(['audience','origin','departure','mobility'].map(id => [id,$(id).value]));
 for (const id of ['budget','days','people']) demand[id] = $(id).value === '' ? null : Number($(id).value);
 demand.rain = $('rain').checked;
 demand.styles = styleInputs.filter(input => input.checked && input.value !== '不拘').map(input => input.value);
 return demand;
}
function validate(demand) {
 const positive = value => Number.isSafeInteger(value) && value > 0;
 const errors = {
   audience:demand.audience ? '' : '請選擇旅客類型。',
   budget:positive(demand.budget) ? '' : '請輸入正整數預算。',
   days:positive(demand.days) ? '' : '請輸入正整數天數。',
   people:(!$('people').validity.badInput && (demand.people === null || positive(demand.people))) ? '' : '請輸入正整數人數。',
   departure:($('departure').validity.badInput || (demand.departure && demand.departure < today)) ? '請輸入今天或之後的日期。' : '',
   style:styleInputs.some(input => input.checked) ? '' : '請選擇至少一種風格，或選不拘。'
 };
 for (const [id,message] of Object.entries(errors)) {
   $(id+'-error').textContent = message;
   const controls = id === 'style' ? styleInputs : [$(id)];
   controls.forEach(el => el.setAttribute('aria-invalid', String(Boolean(message))));
 }
 const first = Object.keys(errors).find(id => errors[id]);
 if (!first) return true;
 const input = first === 'style' ? styleInputs[0] : $(first);
 const details = input.closest('details');
 if (details) details.open = true;
 input.focus();
 return false;
}
function getSourceState(record) {
 const last = record.sources.map(source => source.checkedOn).filter(date => /^\d{4}-\d{2}-\d{2}$/.test(date) && Number.isFinite(Date.parse(date))).sort().at(-1);
 if (!last) return {last,state:'待確認'};
 const limit = [addDays(last,record.type === '活動' ? 7 : 30),record.validUntil,record.eventDates?.end].filter(Boolean).sort()[0];
 return {last,state:today > limit ? '資料過期' : record.status};
}
function assess(plan,demand) {
 const failed = [], pending = [];
 if (plan.audience !== demand.audience) failed.push('audience');
 if (plan.days !== demand.days) failed.push('days');
 if (demand.origin && plan.origin !== demand.origin) failed.push('origin');
 if (plan.status === '停用') return {failed:['date'],pending};
 const estimate = plan.estimate;
 if (!estimate || estimate.scope !== 'TWD/person/trip' || !estimate.validUntil || today > estimate.validUntil ||
   (estimate.people && (!demand.people || demand.people < estimate.people[0] || demand.people > estimate.people[1]))) {
   pending.push('費用待確認');
 } else if (estimate.range[1] > demand.budget) failed.push('budget');
 if (plan.expiresOn && today > plan.expiresOn) pending.push('方案有效期已過，待人工查核');
 if (demand.mobility) {
   const access = plan.mobility[demand.mobility];
   if (access === false) failed.push('access');
   else if (access !== true) pending.push(demand.mobility + '動線待確認');
 }
 for (const [id,day] of plan.stops) {
   const record = recordMap.get(id);
   if (!record) { pending.push('景點資料待確認'); continue; }
   const {state} = getSourceState(record);
   if (state !== '已驗證') pending.push(record.name + '：' + state);
   if (['已取消','活動已取消','已結束','活動已結束','停用'].includes(record.status)) {failed.push('date');continue;}
   if (record.type !== '活動') continue;
   const dates = record.eventDates;
   if (dates?.end && today > dates.end) {failed.push('date');continue;}
   if (!dates?.start || !dates?.end || !demand.departure) {pending.push(record.name+'：到訪日期待確認');continue;}
   const visit = addDays(demand.departure,day-1);
   if (visit < dates.start || visit > dates.end || (record.closedDates || []).includes(visit)) failed.push('date');
   else if (!(record.confirmedOpenDates || []).includes(visit)) pending.push(record.name+'：指定到訪日是否休展待確認');
 }
 return {failed,pending:[...new Set(pending)]};
}
function node(tag,text,className) {
 const el = document.createElement(tag);
 if (text) el.textContent = text;
 if (className) el.className = className;
 return el;
}
function card({plan,pending,hits,rain},demand) {
 const article = node('article','','trip');
 if (demand.rain && rain) article.append(node('span','雨天優先','tag rain-tag'));
 const estimated = plan.estimate && !pending.includes('費用待確認');
 article.append(node('span',plan.status,'tag'),node('h4',plan.title),
  node('p',plan.days+' 天｜'+plan.origin+'出發'),
  node('p',estimated ? plan.estimate.range.map(money).join(' – ')+'／每人／整趟' : '費用待確認','price'));
 if (estimated) article.append(node('p','估價來源：'+plan.estimate.source+'。查詢日 '+plan.estimate.checkedOn+'，試算期限 '+plan.estimate.validUntil+'。適用人數：'+(plan.estimate.people?.join('–') || '不限（示範假設）')+'。'),
  node('p','包含 '+plan.estimate.includes+'。另計 '+plan.estimate.excludes+'。'));
 const matchReasons = [demand.audience,demand.days+' 天',...(demand.origin?[demand.origin+'出發']:[]),...(demand.mobility?[demand.mobility+'動線']:[]),...hits];
 article.append(node('p',pending.length ? '待確認｜'+pending.join('、') : '推薦理由｜'+matchReasons.join('、')+'，估價上限在預算內。'));
 if (demand.rain && rain) {
   article.append(node('p','雨天理由｜'+plan.rain.reason+'。出發前請確認當日開放與交通。'));
 }
 const itinerary = node('ol');
 for (const [id,day] of plan.stops) {
   const record = recordMap.get(id);
   if (!record) continue;
   const {state,last} = getSourceState(record);
   const item = node('li','第 '+day+' 天｜'+record.name+'。'+record.features);
   item.append(node('p','資料狀態：'+state+'。最後查詢 '+(last || '待確認')+'。'));
   if (record.eventDates) item.append(node('p','公告展期 '+record.eventDates.start+' 至 '+record.eventDates.end+'。'));
   for (const source of record.sources) {
     const link = node('a',source.name+'（'+source.checkedOn+'）');
     link.href=source.url; link.target='_blank'; link.rel='noopener noreferrer';
     item.append(link,document.createElement('br'));
   }
   if (record.pendingChecks.length) item.append(node('p','待確認｜'+record.pendingChecks.map(check => check.item).join('、')));
   itinerary.append(item);
 }
 article.append(itinerary);
 return article;
}
function render(demand) {
 const publicMode = $('publicMode').checked;
 const eligible = plans.filter(plan => !publicMode || plan.status !== '模擬資料');
 const matches = [], candidates = [], blocked = new Set();
 for (const plan of eligible) {
   const {failed,pending} = assess(plan,demand);
   if (failed.length) {
     if (plan.audience === demand.audience) failed.forEach(reason => blocked.add(reason));
     continue;
   }
   const hits = demand.styles.filter(style => plan.tags.includes(style));
   const rainStop = plan.rain && recordMap.get(plan.rain.stop);
   const rain = !pending.length && Boolean(rainStop && getSourceState(rainStop).state === '已驗證');
   (pending.length ? candidates : matches).push({plan,pending,hits,rain});
 }
 matches.sort((a,b) => (demand.rain ? Number(b.rain)-Number(a.rain) : 0) || b.hits.length-a.hits.length || a.plan.estimate.range[1]-b.plan.estimate.range[1] || a.plan.id.localeCompare(b.plan.id));
 const top = matches.slice(0,3);
 $('matches').replaceChildren(...top.map(item => card(item,demand)));
 $('candidates').replaceChildren(...candidates.map(item => card(item,demand)));
 $('candidateTitle').hidden = !candidates.length;
 $('resultStatus').textContent = top.length ? '找到 '+top.length+' 個'+(publicMode?'':'示範')+'推薦方案。' : '目前沒有符合所有條件的方案。';
 const blockers = [...blocked].map(key => classifications[key]).filter(Boolean);
 const rainHint = top.some(item => item.rain) ? '有室內參觀安排的方案優先，其餘依風格與估價排序。' : '目前沒有符合條件且具雨天評估的方案，以下保留原條件的推薦。';
 $('resultHint').textContent = top.length ? (demand.rain ? rainHint : '依風格吻合度排序，同分先比較估價上限。') :
   !eligible.length ? '公開模式尚無旅行社核定方案。可複製目前需求供諮詢。' :
   (blockers.length ? '可檢查：'+blockers.join('、')+'。' : '')+'原條件已保留，可修改條件或複製諮詢需求。';
 $('edit').hidden = Boolean(top.length);
 const listed = [...top,...candidates];
 const checks = [...new Set(listed.flatMap(({plan,pending}) => [
   ...pending,...plan.stops.flatMap(([id]) => (recordMap.get(id)?.pendingChecks || []).map(check => check.item))
 ]))];
 $('consultText').value = [
   ...(publicMode ? [] : ['【模擬資料｜本頁行程與價格為示範】']),
   '旅客：'+demand.audience+'／'+demand.days+' 天'+(demand.people?'／'+demand.people+' 人':''),
   '預算上限：'+money(demand.budget)+'／每人／整趟',
   '風格：'+(demand.styles.join('、')||'不拘'),
   ...(demand.rain ? ['偏好：雨天旅遊'] : []),
   '出發日期：'+(demand.departure||'待確認')+'；出發地：'+(demand.origin||'待確認'),
   ...(demand.mobility?['必要動線：'+demand.mobility]:[]),
   '推薦：'+(top.map(item=>item.plan.title).join('、')||'目前無符合方案'),
   ...(candidates.length?['待確認候選：'+candidates.map(item=>item.plan.title).join('、')]:[]),
   '待確認：'+(checks.join('、')||'請依指定日期與旅行社複查')
 ].join('\n');
 $('copyStatus').textContent = '';
 $('consult').hidden = false;
}
function clearResults(message) {
 $('matches').replaceChildren(); $('candidates').replaceChildren();
 $('candidateTitle').hidden = $('consult').hidden = $('edit').hidden = true;
 $('resultHint').textContent = '';
 $('resultStatus').textContent = message;
}
let lastDemand;
$('filters').addEventListener('submit',event => {
 event.preventDefault();
 const demand = readDemand();
 if (!validate(demand)) {
   lastDemand = undefined;
   clearResults('請先完成表單中標示的欄位。');
   return;
 }
 lastDemand = demand;
 render(demand);
});
$('publicMode').addEventListener('change',() => {
 $('modeNotice').textContent = $('publicMode').checked ? '公開模式只列旅行社核定的方案。' : '示範模式：景點有查核來源，行程與價格為模擬資料。';
 if (lastDemand) render(lastDemand);
});
$('edit').addEventListener('click',() => $('audience').focus());
$('copy').addEventListener('click',async () => {
 const field = $('consultText');
 try {
   if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(field.value);
   else throw new Error('Clipboard unavailable');
   $('copyStatus').textContent = '已複製諮詢需求。';
 } catch {
   field.focus(); field.select(); field.setSelectionRange(0,field.value.length);
   $('copyStatus').textContent = '無法自動複製。已選取摘要，可手動複製。';
 }
});
</script>
</body>
